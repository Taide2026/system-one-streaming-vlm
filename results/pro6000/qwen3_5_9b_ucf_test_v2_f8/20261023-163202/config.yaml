question:
  prompt: v2
  state: Surveillance camera footage, 2 seconds.
  text: 'Which defined event happens in these 2 seconds? Answer with its option, or
    None if no defined event happens.

    An event counts from its first act (the first blow, flame, blast, entry or contact)
    until it stops.


    | Option | Counts | Does not count |

    |---|---|---|

    | A | intentionally harming or mistreating others | play, care, or both sides
    hitting (G) |

    | B | legally detaining someone | police only talking to, guiding or searching
    people |

    | C | deliberately setting fire | accidental fire, cooking, smoking |

    | D | physical attack on someone | both sides hitting (G), bumping in a crowd
    |

    | E | illegally entering with the intent to commit a crime | entering through
    an open door or with a key |

    | F | violent release of energy | smoke or fire without a blast (C) |

    | G | violent confrontation | sports, play fighting, attacking someone who does
    not fight back (D) |

    | H | a vehicle colliding with another vehicle, a pedestrian, an animal or an
    obstruction | heavy traffic, a near miss without contact |

    | I | unlawfully taking property | taking without force or threat (L), in a shop
    (K) |

    | J | firing a gun | holding or showing a gun without firing |

    | K | stealing from a retail store | paying customers carrying goods |

    | L | taking someone else''s property without permission | with force or threat
    (I), in a shop (K), after breaking in (E) |

    | M | deliberate destruction of property | accidental damage, repair or demolition
    work |

    | None | no defined event: people walking, talking, working, driving or standing
    as usual | |'
  options:
  - A
  - B
  - C
