# XD-Violence training eval (2026-10-24): the XD fine-tune on the 800 XD test videos, V1 XD prompt; the same windows as the
# zero-shot and cross-dataset runs. backbone.adapter = the training run folder (scripts/stage2-xd-run.sh fills it in).
name: ft_xd_v1_d3nano_eval

dataset:
  name: xd_violence
  asset: xd-violence
  n_violent: 500
  n_normal: 300
  max_duration_s: 4000
  seed: 20261009

window:
  length_s: 2.0
  stride_s: 2.0
  frames: 8

question:
  prompt: v1_xd

input_form:
  name: frames

backbone:
  name: d3
  asset: d3-nano
  memory_cap_gb: 40
  adapter: results/pro6000/ft_xd_v1_d3nano/20261024-133734

answer_head:
  name: option_logits

decision_rules:
  - name: threshold
    start: 0.0
    stop: 1.0
    step: 0.01
