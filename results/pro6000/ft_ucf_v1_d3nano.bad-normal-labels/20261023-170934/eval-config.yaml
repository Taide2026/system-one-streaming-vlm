# Stage 1 evaluation (2026-10-24): the fine-tuned d3-nano (configs/ft_ucf_v1_d3nano.yaml) on all 290 UCF-Crime
# test videos, V1 prompt, the same windows as the zero-shot runs. backbone.adapter is the training run folder
# (results/<machine>/ft_ucf_v1_d3nano/<time>); scripts/ft.sh eval fills it in. Zero-shot reference: d3-nano on UCF 290 not yet run
# (d3-flash 85.6 frame AUC, pro6000).
name: ft_ucf_v1_d3nano_eval

dataset:
  name: ucf_crime
  asset: ucf-crime
  n_anomaly: 140
  n_normal: 150
  max_duration_s: 1000000000
  seed: 0

window:
  length_s: 2.0
  stride_s: 2.0
  frames: 8

question:
  prompt: v1

input_form:
  name: frames

backbone:
  name: d3
  asset: d3-nano
  memory_cap_gb: 40
  adapter: results/pro6000/ft_ucf_v1_d3nano/20261023-170934

answer_head:
  name: option_logits

decision_rules:
  - name: threshold
    start: 0.0
    stop: 1.0
    step: 0.01
