name: pilot_ucf_v1_s1_recompute_l2
dataset:
  name: ucf_crime
  asset: ucf-crime
  names:
  - RoadAccidents010_x264.mp4
  - RoadAccidents004_x264.mp4
  - RoadAccidents011_x264.mp4
  - RoadAccidents122_x264.mp4
  - Shoplifting037_x264.mp4
  - Normal_Videos_345_x264.mp4
  - Normal_Videos_881_x264.mp4
  - Normal_Videos_878_x264.mp4
  - Normal_Videos_745_x264.mp4
  - Normal_Videos_889_x264.mp4
window:
  length_s: 2.0
  stride_s: 2.0
  frames: 8
question:
  prompt: v1
  state: Surveillance camera footage, 2 seconds.
  text: If you were a law enforcement agency, would you rate this scene as a scene
    involving suspicious activities such as abuse (intentionally harming or mistreating
    others), arrest (legally detaining someone), arson (deliberately setting fire),
    assault (physical attack on someone), burglary (illegally entering with the intent
    to commit a crime), disorderly conduct (disruptive or destructive behavior), explosion
    (violent release of energy), fighting (violent confrontation), robbery (unlawfully
    taking property), shooting (firing a gun), shoplifting (stealing from a retail
    store), theft (taking someone else's property without permission), or vandalism
    (deliberate destruction of property), rather than a standard scene?
  options:
  - 'Yes'
  - 'No'
  positive: 'Yes'
input_form:
  name: frames
backbone:
  name: clef_flash
  asset: clef-flash
  memory_cap_gb: 40
answer_head:
  name: option_logits
decision_rules:
- name: threshold
  start: 0.0
  stop: 1.0
  step: 0.01
context:
  strategy: recompute
  past_s: 2.0
