# V2, ESOM style (arXiv 2026): the question is prompt v2_xd of src/s1stream/prompt.py; score 1 - p(None).
# Latency and abnormal metrics of StartLux-Decision v1.1 4B Instant (StartLux Labs, decision model, bidirectional prompt) on the XD-Violence test set: 500 violent + 300 non-violent = 800.
# max_duration_s 4000 keeps every test video (the longest is 1383 s): 27.0 h at 24 fps, 48663 windows of 2 s.
# Run: scripts/run.sh run configs/startlux_4b_xd_test_v2_f8.yaml
name: startlux_4b_xd_test_v2_f8

dataset:
  name: xd_violence
  asset: xd-violence
  n_violent: 500
  n_normal: 300
  max_duration_s: 4000
  seed: 20261009

window:
  length_s: 2.0
  stride_s: 2.0
  frames: 8

question:
  prompt: v2_xd

input_form:
  name: frames

backbone:
  name: startlux
  asset: startlux-4b-instant
  memory_cap_gb: 40

answer_head:
  name: option_logits

decision_rules:
  - name: threshold
    start: 0.0
    stop: 1.0
    step: 0.01
