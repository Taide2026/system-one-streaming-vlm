# Zero-shot reference on the same machine as the fine-tune (2026-10-24): Clef-Flash, all 290 UCF-Crime test videos,
# V1 prompt, no adapter. Same windows as configs/ft_ucf_v1_clef_eval.yaml so the two runs differ only in the weights.
name: zs_ucf_v1_clef_eval

dataset:
  name: ucf_crime
  asset: ucf-crime
  n_anomaly: 140
  n_normal: 150
  max_duration_s: 1000000000
  seed: 0

window:
  length_s: 2.0
  stride_s: 2.0
  frames: 8

question:
  prompt: v1

input_form:
  name: frames

backbone:
  name: clef_flash
  asset: clef-flash
  memory_cap_gb: 40

answer_head:
  name: option_logits

decision_rules:
  - name: threshold
    start: 0.0
    stop: 1.0
    step: 0.01
