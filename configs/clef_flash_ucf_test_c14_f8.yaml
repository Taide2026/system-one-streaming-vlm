# 14-class prompt: the question lists the 13 UCF-Crime anomaly classes + Normal; score = 1 - p(Normal).
# Latency of Clef-Flash on all UCF-Crime test videos with frame annotations: 140 anomaly + 150 normal = 290.
# Run: scripts/run.sh run configs/clef_flash_ucf_test_c14_f8.yaml
name: clef_flash_ucf_test_c14_f8

dataset:
  name: ucf_crime
  asset: ucf-crime
  n_anomaly: 140
  n_normal: 150
  max_duration_s: 4000
  seed: 20261009

window:
  length_s: 2.0
  stride_s: 2.0
  frames: 8

question:
  prompt: c14

input_form:
  name: frames

backbone:
  name: clef_flash
  asset: clef-flash
  memory_cap_gb: 40

answer_head:
  name: option_logits

decision_rules:
  - name: threshold
    start: 0.0
    stop: 1.0
    step: 0.01
