# V1, MoniTor style (NeurIPS 2025): the question is prompt v1 of src/s1stream/prompt.py; score p(Yes).
# Latency and abnormal metrics of StartLux-Decision v1.1 4B Instant (StartLux Labs, decision model, bidirectional prompt) on all UCF-Crime test videos with frame annotations: 140 anomaly + 150 normal = 290.
# max_duration_s 4000 keeps every test video (the longest is 60 min): 10.3 h, 18390 windows of 2 s.
# Run: scripts/run.sh run configs/startlux_4b_ucf_test_v1_f8.yaml
name: startlux_4b_ucf_test_v1_f8

dataset:
  name: ucf_crime
  asset: ucf-crime
  n_anomaly: 140
  n_normal: 150
  max_duration_s: 4000
  seed: 20261009

window:
  length_s: 2.0
  stride_s: 2.0
  frames: 8

question:
  prompt: v1

input_form:
  name: frames

backbone:
  name: startlux
  asset: startlux-4b-instant
  memory_cap_gb: 40

answer_head:
  name: option_logits

decision_rules:
  - name: threshold
    start: 0.0
    stop: 1.0
    step: 0.01
