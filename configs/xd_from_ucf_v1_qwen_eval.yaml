# Cross-dataset (2026-10-25): the UCF-Crime fine-tune of the Qwen3.5-9B control evaluated on the 800 XD-Violence test
# videos with the V1 XD prompt.
name: xd_from_ucf_v1_qwen_eval

dataset:
  name: xd_violence
  asset: xd-violence
  n_violent: 500
  n_normal: 300
  max_duration_s: 4000
  seed: 20261009

window:
  length_s: 2.0
  stride_s: 2.0
  frames: 8

question:
  prompt: v1_xd

input_form:
  name: frames

backbone:
  name: qwen_first_token
  asset: qwen3.5-9b
  memory_cap_gb: 40
  adapter: results/pro6000/ft_ucf_v1_qwen/20261024-061856

answer_head:
  name: option_logits

decision_rules:
  - name: threshold
    start: 0.0
    stop: 1.0
    step: 0.01
