# Stage 2 push (2026-10-24): d3-nano, hard labels, 4x the data (40k abnormal + 40k normal windows, most of the
# training split's abnormal windows), 1 epoch = 2,500 steps.
name: ft_ucf_v1_d3nano_full

data:
  asset: ucf-crime
  hivau_json: $S1_DATASETS/HolmesVAU/HIVAU-70k/raw_annotations/ucf_database_train.json  # S1_DATASETS: scripts/ft.sh
  n_abnormal: 40000
  n_normal: 40000
  n_val: 2000
  holdout: 0.1
  seed: 0
  hard_labels: true

window:
  length_s: 2.0
  stride_s: 2.0
  frames: 8

question:
  prompt: v1

backbone:
  name: d3
  asset: d3-nano

lora:
  r: 64
  alpha: 128
  dropout: 0.0

optim:
  lr: 1.5e-4
  head_lr: 1.5e-4
  warmup: 0.03
  batch: 8
  accumulate: 4
  epochs: 1
  workers: 6
  grad_checkpoint: true
