# V1, MoniTor style (NeurIPS 2025): Yes / No with MoniTor's anomaly prior, its 13 activities and their
# definitions verbatim (disorderly conduct and theft as there, no road accident); score p(Yes).
# Latency of Clef-Flash on the UCF-Crime short test videos (< 50 s): 49 anomaly + 68 normal = all 117.
# max_duration_s 49.9 sits between the longest short video (49.83 s) and the shortest medium one (49.97 s).
# Run: scripts/run.sh run configs/clef_flash_ucf_short_v1_f8.yaml
name: clef_flash_ucf_short_v1_f8

dataset:
  name: ucf_crime
  asset: ucf-crime
  n_anomaly: 49
  n_normal: 68
  max_duration_s: 49.9
  seed: 20261009

window:
  length_s: 2.0
  stride_s: 2.0
  frames: 8

question:
  state: Surveillance camera footage, 2 seconds.
  # MoniTor's context prompt (github.com/YsTvT/MoniTor, slurm/ucf_crime/04_summary.sh, "Recommended"), its 13
  # activities and definitions verbatim; its 0-1 rating becomes Yes / No.
  text: >-
    If you were a law enforcement agency, would you rate this scene as a scene involving suspicious activities such as
    abuse (intentionally harming or mistreating others), arrest (legally detaining someone), arson (deliberately
    setting fire), assault (physical attack on someone), burglary (illegally entering with the intent to commit a
    crime), disorderly conduct (disruptive or destructive behavior), explosion (violent release of energy), fighting
    (violent confrontation), robbery (unlawfully taking property), shooting (firing a gun), shoplifting (stealing from
    a retail store), theft (taking someone else's property without permission), or vandalism (deliberate destruction
    of property), rather than a standard scene?
  options: ["Yes", "No"]
  positive: "Yes"

input_form:
  name: frames

backbone:
  name: clef_flash
  asset: clef-flash
  memory_cap_gb: 40

answer_head:
  name: option_logits

decision_rules:
  - name: threshold
    start: 0.0
    stop: 1.0
    step: 0.01
