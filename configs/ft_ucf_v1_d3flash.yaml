# Stage 2 push (2026-10-24): d3-flash (8.4B, zero-shot 85.6) with the final recipe (hard labels, random negatives,
# 8 frames, 20k windows), batch 2 x 16 for a shared GPU.
name: ft_ucf_v1_d3flash

data:
  asset: ucf-crime
  hivau_json: $S1_DATASETS/HolmesVAU/HIVAU-70k/raw_annotations/ucf_database_train.json  # S1_DATASETS: scripts/ft.sh
  n_abnormal: 10000
  n_normal: 10000
  n_val: 2000
  holdout: 0.1
  seed: 0
  hard_labels: true

window:
  length_s: 2.0
  stride_s: 2.0
  frames: 8

question:
  prompt: v1

backbone:
  name: d3
  asset: d3-flash

lora:
  r: 64
  alpha: 128
  dropout: 0.0

optim:
  lr: 1.0e-4
  head_lr: 1.0e-4
  warmup: 0.03
  batch: 2
  accumulate: 16
  epochs: 1
  workers: 6
  grad_checkpoint: true
