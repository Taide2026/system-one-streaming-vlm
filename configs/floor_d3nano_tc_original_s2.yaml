name: floor_d3nano_tc_original_s2
data:
  asset: ucf-crime
  hivau_json: $S1_DATASETS/HolmesVAU/HIVAU-70k/raw_annotations/ucf_database_train.json
  n_abnormal: 5000
  n_normal: 5000
  n_val: 2000
  holdout: 0.1
  seed: 2
tasks:
  v1:
    n: 10000
  c14:
    n: 5000
  replay:
    n: 5000
    split: train
    per_config: 400
anchor:
  kl_lambda: 0.5
window:
  length_s: 2.0
  stride_s: 2.0
  frames: 8
question:
  prompt: v1
backbone:
  name: d3
  asset: d3-nano
lora:
  r: 64
  alpha: 128
  dropout: 0.0
optim:
  lr: 0.00015
  head_lr: 0.00015
  warmup: 0.03
  batch: 8
  accumulate: 4
  epochs: 1
  workers: 6
  grad_checkpoint: false
input_form:
  name: temporal_control
  mode: original
  seed: 2
  history_s: 6.0
