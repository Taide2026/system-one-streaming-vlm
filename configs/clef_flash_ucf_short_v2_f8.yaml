# V2, ESOM style (arXiv 2026): a definition table with anonymous options A-M + None; score 1 - p(None).
# Options -> UCF-Crime classes: A Abuse, B Arrest, C Arson, D Assault, E Burglary, F Explosion, G Fighting,
# H RoadAccidents, I Robbery, J Shooting, K Shoplifting, L Stealing, M Vandalism.
# Latency of Clef-Flash on the UCF-Crime short test videos (< 50 s): 49 anomaly + 68 normal = all 117.
# max_duration_s 49.9 sits between the longest short video (49.83 s) and the shortest medium one (49.97 s).
# Run: scripts/run.sh run configs/clef_flash_ucf_short_v2_f8.yaml
name: clef_flash_ucf_short_v2_f8

dataset:
  name: ucf_crime
  asset: ucf-crime
  n_anomaly: 49
  n_normal: 68
  max_duration_s: 49.9
  seed: 20261009

window:
  length_s: 2.0
  stride_s: 2.0
  frames: 8

question:
  state: Surveillance camera footage, 2 seconds.
  # ESOM's normalized definition: anonymous options, what counts, what does not count, the event boundary, None, as a
  # markdown table. Counts: MoniTor's definitions (H: Wikipedia, Traffic collision). Does not count and the boundary:
  # ours, ESOM's own tables are not released.
  text: |-
    Which defined event happens in these 2 seconds? Answer with its option, or None if no defined event happens.
    An event counts from its first act (the first blow, flame, blast, entry or contact) until it stops.

    | Option | Counts | Does not count |
    |---|---|---|
    | A | intentionally harming or mistreating others | play, care, or both sides hitting (G) |
    | B | legally detaining someone | police only talking to, guiding or searching people |
    | C | deliberately setting fire | accidental fire, cooking, smoking |
    | D | physical attack on someone | both sides hitting (G), bumping in a crowd |
    | E | illegally entering with the intent to commit a crime | entering through an open door or with a key |
    | F | violent release of energy | smoke or fire without a blast (C) |
    | G | violent confrontation | sports, play fighting, attacking someone who does not fight back (D) |
    | H | a vehicle colliding with another vehicle, a pedestrian, an animal or an obstruction | heavy traffic, a near miss without contact |
    | I | unlawfully taking property | taking without force or threat (L), in a shop (K) |
    | J | firing a gun | holding or showing a gun without firing |
    | K | stealing from a retail store | paying customers carrying goods |
    | L | taking someone else's property without permission | with force or threat (I), in a shop (K), after breaking in (E) |
    | M | deliberate destruction of property | accidental damage, repair or demolition work |
    | None | no defined event: people walking, talking, working, driving or standing as usual | |
  options: ["None", "A", "B", "C", "D", "E", "F", "G", "H", "I", "J", "K", "L", "M"]
  positive: ["A", "B", "C", "D", "E", "F", "G", "H", "I", "J", "K", "L", "M"]

input_form:
  name: frames

backbone:
  name: clef_flash
  asset: clef-flash
  memory_cap_gb: 40

answer_head:
  name: option_logits

decision_rules:
  - name: threshold
    start: 0.0
    stop: 1.0
    step: 0.01
