# Foveated fine-tune (2026-10-31, deck pp. 57-58): the floor arm C recipe with the V1 windows foveated
# (4 full frames + 4 TGM-peak crops, one forward; src/s1stream/input_forms/foveated.py).
# Run: scripts/train-floor.py configs/fov_d3nano_c.yaml
name: fov2h_d3nano_c

data:
  asset: ucf-crime
  hivau_json: $S1_DATASETS/HolmesVAU/HIVAU-70k/raw_annotations/ucf_database_train.json
  n_abnormal: 5000
  n_normal: 5000
  n_val: 2000
  holdout: 0.1
  seed: 0

tasks:
  v1:
    n: 10000
    extra_records: results/pro6000/hardneg_train.jsonl
  c14:
    n: 5000
  replay:
    n: 5000
    split: train
    per_config: 400

anchor:
  kl_lambda: 0.5


window:
  length_s: 2.0
  stride_s: 2.0
  frames: 8

question:
  prompt: v1

input_form:
  name: foveated
  frac: 0.333
  upscale: 2
  max_area: 0.045

backbone:
  name: d3
  asset: d3-nano

lora:
  r: 64
  alpha: 128
  dropout: 0.0

optim:
  lr: 1.5e-4
  head_lr: 1.5e-4
  warmup: 0.03
  batch: 8
  accumulate: 4
  epochs: 1
  workers: 6
  grad_checkpoint: true
