# Over-triggering test (2026-10-29): the V1 anomaly question on the UCF101 test clips (no anomalies): false-alarm rate, variant zs.
# from scripts/ucf101-accuracy.py. Variant: zs (zs = zero-shot, ucfft = the UCF-Crime hard-label LoRA, probe = read-out only).
name: ucf101_v1_d3nano_zs

dataset:
  name: ucf101
  path: /data/kidflash7011/datasets/ucf101
  split: testlist01.txt

window:
  length_s: 2.0
  stride_s: 2.0
  frames: 8

question:
  prompt: v1

input_form:
  name: frames

backbone:
  name: d3
  asset: d3-nano
  memory_cap_gb: 40


answer_head:
  name: option_logits

decision_rules:
  - name: threshold
    start: 0.0
    stop: 1.0
    step: 0.01
