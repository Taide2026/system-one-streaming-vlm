# Pilot: KV cache across windows (2026-10-23), S2 sliding KV: the past 4 s cached.
# 10 UCF-Crime test videos: 5 events shorter than 4 s that cross a 2 s window boundary and were missed by Clef-Flash
# (V1 prompt, p(Yes) < 0.5 in both windows: RoadAccidents010 0.26 / 0.20, 004 0.01 / 0.01, 011 0.03 / 0.02,
# 122 0.03 / 0.09, Shoplifting037 0.23 / 0.09) and the 5 shortest normal test videos. Same frames, prompt and label
# in every pilot config; only `context` differs. Run: scripts/run.sh run configs/pilot_ucf_v1_s2_kv_l4.yaml
name: pilot_ucf_v1_s2_kv_l4

dataset:
  name: ucf_crime
  asset: ucf-crime
  names:
    - RoadAccidents010_x264.mp4
    - RoadAccidents004_x264.mp4
    - RoadAccidents011_x264.mp4
    - RoadAccidents122_x264.mp4
    - Shoplifting037_x264.mp4
    - Normal_Videos_345_x264.mp4
    - Normal_Videos_881_x264.mp4
    - Normal_Videos_878_x264.mp4
    - Normal_Videos_745_x264.mp4
    - Normal_Videos_889_x264.mp4

window:
  length_s: 2.0
  stride_s: 2.0
  frames: 8

question:
  prompt: v1

input_form:
  name: frames

backbone:
  name: clef_flash
  asset: clef-flash
  memory_cap_gb: 40

answer_head:
  name: option_logits

decision_rules:
  - name: threshold
    start: 0.0
    stop: 1.0
    step: 0.01

context:
  strategy: kv
  past_s: 4.0
