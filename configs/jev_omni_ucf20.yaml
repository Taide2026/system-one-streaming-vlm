# Feasibility run (proposal .specs/changes/2026-10-09-ucf-streaming-feasibility): Jev-Omni on 20 UCF-Crime test videos.
# Run:    S1_ASSETS=<asset root> uv run s1stream run configs/jev_omni_ucf20.yaml
# Report: uv run s1stream report results/<machine>/jev_omni_ucf20/<run>
name: jev_omni_ucf20

dataset:
  name: ucf_crime
  asset: ucf-crime
  n_anomaly: 10
  n_normal: 10
  max_duration_s: 60
  seed: 20261009

window:
  length_s: 2.0
  stride_s: 2.0
  frames: 8

question:
  prompt: yes_no_hint

input_form:
  name: frames

backbone:
  name: jev_omni
  asset: jev-omni
  memory_cap_gb: 40

answer_head:
  name: option_prob
  asset: jev-omni

decision_rules:
  - name: threshold
    start: 0.0
    stop: 1.0
    step: 0.01
