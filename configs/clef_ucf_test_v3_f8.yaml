# V3, ReactVAU style (ECCV 2026): the question is prompt v3 of src/s1stream/prompt.py; score p(Yes).
# Latency and abnormal metrics of Clef (Cloudflare, Qwen3.8-27B post-train with a joint schema head) on all UCF-Crime test videos with frame annotations: 140 anomaly + 150 normal = 290.
# max_duration_s 4000 keeps every test video (the longest is 60 min): 10.3 h, 18390 windows of 2 s.
# Run: scripts/run.sh run configs/clef_ucf_test_v3_f8.yaml
name: clef_ucf_test_v3_f8

dataset:
  name: ucf_crime
  asset: ucf-crime
  n_anomaly: 140
  n_normal: 150
  max_duration_s: 4000
  seed: 20261009

window:
  length_s: 2.0
  stride_s: 2.0
  frames: 8

question:
  prompt: v3

input_form:
  name: frames

backbone:
  name: clef_flash
  asset: clef
  memory_cap_gb: 90

answer_head:
  name: option_logits

decision_rules:
  - name: threshold
    start: 0.0
    stop: 1.0
    step: 0.01
