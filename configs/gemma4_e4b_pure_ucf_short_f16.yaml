# Gemma 4 E4B, pure prompt (the question text and "Answer yes or no."), free decoding.
# Latency and abnormal metrics on the UCF-Crime short test videos (< 50 s): 49 anomaly + 68 normal = all 117.
# max_duration_s 49.9 sits between the longest short video (49.83 s) and the shortest medium one (49.97 s).
# Run: scripts/run.sh run configs/gemma4_e4b_pure_ucf_short_f16.yaml
name: gemma4_e4b_pure_ucf_short_f16

dataset:
  name: ucf_crime
  asset: ucf-crime
  n_anomaly: 49
  n_normal: 68
  max_duration_s: 49.9
  seed: 20261009

window:
  length_s: 2.0
  stride_s: 2.0
  frames: 16

question:
  prompt: yes_no

input_form:
  name: frames

backbone:
  name: gemma_generate
  asset: gemma-4-e4b
  prompt: question
  decode: free
  max_new_tokens: 64
  memory_cap_gb: 40

answer_head:
  name: generated_answer

decision_rules:
  - name: threshold
    start: 0.0
    stop: 1.0
    step: 0.01
