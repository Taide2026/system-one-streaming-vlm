# Active foveation eval (2026-11-02): the fov2 adapter, the WHEN gate = the model itself (previous window p in
# the unsure band -> foveate the next window). First window of each video = full view. Needs the stateful runner.
name: fovgate_290_d3nano_c

dataset:
  name: ucf_crime
  asset: ucf-crime
  n_anomaly: 140
  n_normal: 150
  max_duration_s: 1000000000
  seed: 0

window:
  length_s: 2.0
  stride_s: 2.0
  frames: 8

question:
  prompt: v1

input_form:
  name: foveated_gated
  band: [0.3, 0.7]
  frac: 0.333
  upscale: 2
  max_area: 0.045

backbone:
  name: d3
  asset: d3-nano
  memory_cap_gb: 40
  adapter: ADAPTER_RUN_DIR

answer_head:
  name: option_logits

decision_rules:
  - name: threshold
    start: 0.0
    stop: 1.0
    step: 0.01
