# Training floor arm C on d3 27B (Qwen3.8 base; 2026-11-04): the size-ceiling point of the matrix.
# batch 1 x accumulate 32: the 27B in bf16 + LoRA + grad checkpointing fits one 96 GB GPU.
# Run: scripts/train-floor.py configs/floor_d327b_c.yaml
name: floor_d327b_c

data:
  asset: ucf-crime
  hivau_json: $S1_DATASETS/HolmesVAU/HIVAU-70k/raw_annotations/ucf_database_train.json
  n_abnormal: 5000
  n_normal: 5000
  n_val: 2000
  holdout: 0.1
  seed: 0

tasks:
  v1:
    n: 10000
  c14:
    n: 5000
  replay:
    n: 5000
    split: train
    per_config: 400

anchor:
  kl_lambda: 0.5


window:
  length_s: 2.0
  stride_s: 2.0
  frames: 8

question:
  prompt: v1

backbone:
  name: d3
  asset: d3-27b

lora:
  r: 64
  alpha: 128
  dropout: 0.0

optim:
  lr: 1.5e-4
  head_lr: 1.5e-4
  warmup: 0.03
  batch: 1
  accumulate: 32
  epochs: 1
  workers: 6
  grad_checkpoint: true
