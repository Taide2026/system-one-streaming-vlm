# 14-class prompt: the question lists the 13 UCF-Crime anomaly classes + Normal; score = 1 - p(Normal).
# The UCF-Crime test videos above 49.9 s: 91 anomaly + 82 normal = 173. With the 117 short ones of
# d3_ucf_short_c14_f8 they make all 290 (scripts/merge-c14-290.py -> results/d3_ucf_test_c14_f8).
# Run: scripts/run.sh run configs/d3_ucf_long_c14_f8.yaml
name: d3_ucf_long_c14_f8

dataset:
  name: ucf_crime
  asset: ucf-crime
  n_anomaly: 91
  n_normal: 82
  min_duration_s: 49.9
  max_duration_s: 4000
  seed: 20261009

window:
  length_s: 2.0
  stride_s: 2.0
  frames: 8

question:
  prompt: c14

input_form:
  name: frames

backbone:
  name: d3
  asset: d3
  memory_cap_gb: 90

answer_head:
  name: option_logits

decision_rules:
  - name: threshold
    start: 0.0
    stop: 1.0
    step: 0.01
