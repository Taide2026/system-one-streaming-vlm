# 14-class prompt: the question lists the 13 UCF-Crime anomaly classes + Normal; score = 1 - p(Normal).
# Latency and abnormal metrics of d3 (Decision 3.0) on all UCF-Crime test videos with frame annotations: 140 anomaly + 150 normal = 290.
# Run: scripts/run.sh run configs/d3_ucf_test_c14_f8.yaml
name: d3_ucf_test_c14_f8

dataset:
  name: ucf_crime
  asset: ucf-crime
  n_anomaly: 140
  n_normal: 150
  max_duration_s: 4000
  seed: 20261009

window:
  length_s: 2.0
  stride_s: 2.0
  frames: 8

question:
  state: Surveillance camera footage, 2 seconds.
  text: What is happening?
  # UCF-Crime's 13 anomaly classes + Normal. Arrest is "Police arrest" (for Gemma 4 E4B "Arrest" and "Arson" share
  # their first token) and RoadAccidents is "Road accident"; the score is the sum over the 13 anomaly classes.
  options: [Normal, Abuse, Police arrest, Arson, Assault, Burglary, Explosion, Fighting, Road accident, Robbery,
            Shooting, Shoplifting, Stealing, Vandalism]
  positive: [Abuse, Police arrest, Arson, Assault, Burglary, Explosion, Fighting, Road accident, Robbery, Shooting,
             Shoplifting, Stealing, Vandalism]

input_form:
  name: frames

backbone:
  name: d3
  asset: d3
  memory_cap_gb: 90

answer_head:
  name: option_logits

decision_rules:
  - name: threshold
    start: 0.0
    stop: 1.0
    step: 0.01
