# V3, ReactVAU style (ECCV 2026): its fast model's question; score p(Yes).
# Latency and abnormal metrics of d3 (Decision 3.0) on the UCF-Crime short test videos (< 50 s): 49 anomaly + 68 normal = all 117.
# max_duration_s 49.9 sits between the longest short video (49.83 s) and the shortest medium one (49.97 s).
# Run: scripts/run.sh run configs/d3_ucf_short_v3_f8.yaml
name: d3_ucf_short_v3_f8

dataset:
  name: ucf_crime
  asset: ucf-crime
  n_anomaly: 49
  n_normal: 68
  max_duration_s: 49.9
  seed: 20261009

window:
  length_s: 2.0
  stride_s: 2.0
  frames: 8

question:
  state: Surveillance camera footage, 2 seconds.
  # ReactVAU's fast-model question, without "Analyze the 2x2 video grid." (8 frames here, no grid).
  text: Is there any anomalous behavior, safety hazard, or event that disrupts the normal scene?
  options: ["Yes", "No"]
  positive: "Yes"

input_form:
  name: frames

backbone:
  name: d3
  asset: d3
  memory_cap_gb: 90

answer_head:
  name: option_logits

decision_rules:
  - name: threshold
    start: 0.0
    stop: 1.0
    step: 0.01
