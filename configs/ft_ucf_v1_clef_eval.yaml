# Stage 1 evaluation (2026-10-24): the fine-tuned Clef-Flash (configs/ft_ucf_v1_clef.yaml) on all 290 UCF-Crime
# test videos, V1 prompt, the same windows as the zero-shot runs. backbone.adapter is the training run folder
# (results/<machine>/ft_ucf_v1_clef/<time>); scripts/ft.sh eval fills it in. Zero-shot reference: 84.1 frame AUC
# (pro6000, 2026-10-22).
name: ft_ucf_v1_clef_eval

dataset:
  name: ucf_crime
  asset: ucf-crime
  n_anomaly: 140
  n_normal: 150
  max_duration_s: 1.0e9
  seed: 0

window:
  length_s: 2.0
  stride_s: 2.0
  frames: 8

question:
  prompt: v1

input_form:
  name: frames

backbone:
  name: clef_flash
  asset: clef-flash
  memory_cap_gb: 40
  adapter: ADAPTER_RUN_DIR

answer_head:
  name: option_logits

decision_rules:
  - name: threshold
    start: 0.0
    stop: 1.0
    step: 0.01
