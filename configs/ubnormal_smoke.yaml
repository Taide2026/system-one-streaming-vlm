# Transfer test (2026-10-29): d3-nano with the V1 anomaly question on the UBnormal test split (157 abnormal + 52 normal
# synthetic campus videos, frame-level tracks as events); variant: zs. Frame AUC from the report.
name: ubnormal_smoke

dataset:
  name: ubnormal
  path: /data/kidflash7011/datasets/ubnormal
  split: test
  n_videos: 4

window:
  length_s: 2.0
  stride_s: 2.0
  frames: 8

question:
  prompt: v1

input_form:
  name: frames

backbone:
  name: d3
  asset: d3-nano
  memory_cap_gb: 40


answer_head:
  name: option_logits

decision_rules:
  - name: threshold
    start: 0.0
    stop: 1.0
    step: 0.01
