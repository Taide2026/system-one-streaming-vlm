# Latency of imajev-4b on the UCF-Crime short test videos (< 50 s): 49 anomaly + 68 normal = all 117.
# max_duration_s 49.9 sits between the longest short video (49.83 s) and the shortest medium one (49.97 s).
# Run: scripts/run.sh run configs/imajev_4b_ucf_short_f8.yaml
name: imajev_4b_ucf_short_f8

dataset:
  name: ucf_crime
  asset: ucf-crime
  n_anomaly: 49
  n_normal: 68
  max_duration_s: 49.9
  seed: 20261009

window:
  length_s: 2.0
  stride_s: 2.0
  frames: 8

question:
  state: Surveillance camera footage, 2 seconds.
  text: Is something abnormal happening?
  options: ["Yes", "No"]
  positive: "Yes"

input_form:
  name: frames

backbone:
  name: imajev
  asset: imajev-4b
  base: qwen3.5-4b
  memory_cap_gb: 40

answer_head:
  name: option_logits

decision_rules:
  - name: threshold
    start: 0.0
    stop: 1.0
    step: 0.01
