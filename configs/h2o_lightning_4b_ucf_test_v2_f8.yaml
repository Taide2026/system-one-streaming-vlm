# V2, ESOM style (arXiv 2026): the question is prompt v2 of src/s1stream/prompt.py; score 1 - p(None).
# Latency and abnormal metrics of H2O-Lightning-4B (image weights; at most 4 images: 4 of the 8 frames, spread over the window) on all UCF-Crime test videos with frame annotations: 140 anomaly + 150 normal = 290.
# max_duration_s 4000 keeps every test video (the longest is 60 min): 10.3 h, 18390 windows of 2 s.
# Run: scripts/run.sh run configs/h2o_lightning_4b_ucf_test_v2_f8.yaml
name: h2o_lightning_4b_ucf_test_v2_f8

dataset:
  name: ucf_crime
  asset: ucf-crime
  n_anomaly: 140
  n_normal: 150
  max_duration_s: 4000
  seed: 20261009

window:
  length_s: 2.0
  stride_s: 2.0
  frames: 8

question:
  prompt: v2

input_form:
  name: frames

backbone:
  name: h2o_lightning
  asset: h2o-lightning-4b-image
  memory_cap_gb: 40

answer_head:
  name: option_logits

decision_rules:
  - name: threshold
    start: 0.0
    stop: 1.0
    step: 0.01
