# Roadmap A2 (2026-11-07): V1 soft + KL (the v1kl cell) + 5,000 within-video (in, out) pairs with a margin ranking loss on p(Yes).
# Factorial cell (2026-11-06): V1 soft coverage + KL anchor, no 14-class, no replay.
# Training floor arm C (2026-10-31, deck p. 61): multi-task mix on d3-nano. B = mix, C = +KL anchor, D = DPO.
# Run: scripts/train-floor.py configs/floor_d3nano_c.yaml
name: floor_d3nano_pair_m5

data:
  asset: ucf-crime
  hivau_json: $S1_DATASETS/HolmesVAU/HIVAU-70k/raw_annotations/ucf_database_train.json
  n_abnormal: 5000
  n_normal: 5000
  n_val: 2000
  holdout: 0.1
  seed: 0

tasks:
  v1:
    n: 10000
  v1pair:
    n_pairs: 5000
    margin: 0.5
    weight: 1.0

anchor:
  kl_lambda: 0.5


window:
  length_s: 2.0
  stride_s: 2.0
  frames: 8

question:
  prompt: v1

backbone:
  name: d3
  asset: d3-nano

lora:
  r: 64
  alpha: 128
  dropout: 0.0

optim:
  lr: 1.5e-4
  head_lr: 1.5e-4
  warmup: 0.03
  batch: 8
  accumulate: 4
  epochs: 1
  workers: 6
  grad_checkpoint: false
