# Latency and abnormal metrics of d1-3B (Liquid AI, LFM2.5-VL-3B decision model) on all UCF-Crime test videos with frame annotations: 140 anomaly + 150 normal = 290.
# max_duration_s 4000 keeps every test video (the longest is 60 min): 10.3 h, 18390 windows of 2 s.
# Run: scripts/run.sh run configs/d1_3b_ucf_test_f8.yaml
name: d1_3b_ucf_test_f8

dataset:
  name: ucf_crime
  asset: ucf-crime
  n_anomaly: 140
  n_normal: 150
  max_duration_s: 4000
  seed: 20261009

window:
  length_s: 2.0
  stride_s: 2.0
  frames: 8

question:
  state: Surveillance camera footage, 2 seconds.
  text: Is something abnormal happening?
  options: ["Yes", "No"]
  positive: "Yes"

input_form:
  name: frames

backbone:
  name: d1
  asset: d1-3b
  memory_cap_gb: 40

answer_head:
  name: option_logits

decision_rules:
  - name: threshold
    start: 0.0
    stop: 1.0
    step: 0.01
