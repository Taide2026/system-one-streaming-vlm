# Stage 2 (2026-10-24): the control. Qwen3.5-9B instruction model (no decision training), read on the first token of
# each option, fine-tuned with the final recipe (hard labels, random negatives, 8 frames, 20k windows). Does decision
# post-training still matter after the fine-tune?
name: ft_ucf_v1_qwen

data:
  asset: ucf-crime
  hivau_json: $S1_DATASETS/HolmesVAU/HIVAU-70k/raw_annotations/ucf_database_train.json  # S1_DATASETS: scripts/ft.sh
  n_abnormal: 10000
  n_normal: 10000
  n_val: 2000
  holdout: 0.1
  seed: 0
  hard_labels: true

window:
  length_s: 2.0
  stride_s: 2.0
  frames: 8

question:
  prompt: v1

backbone:
  name: qwen_first_token
  asset: qwen3.5-9b

lora:
  r: 64
  alpha: 128
  dropout: 0.0

optim:
  lr: 1.0e-4
  head_lr: 1.0e-4
  warmup: 0.03
  batch: 2
  accumulate: 16
  epochs: 1
  workers: 6
  grad_checkpoint: true
