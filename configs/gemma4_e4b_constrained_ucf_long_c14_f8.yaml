# 14-class prompt: the question lists the 13 UCF-Crime anomaly classes + Normal; score = 1 - p(Normal).
# Gemma 4 E4B, structured prompt, constrained decoding (one of the 14 options; probabilities from their first-token logits).
# The UCF-Crime test videos above 49.9 s: 91 anomaly + 82 normal = 173. With the 117 short ones of
# gemma4_e4b_constrained_ucf_short_c14_f8 they make all 290 (scripts/merge-c14-290.py -> results/spark/gemma4_e4b_constrained_ucf_test_c14_f8).
# Run: scripts/run.sh run configs/gemma4_e4b_constrained_ucf_long_c14_f8.yaml
name: gemma4_e4b_constrained_ucf_long_c14_f8

dataset:
  name: ucf_crime
  asset: ucf-crime
  n_anomaly: 91
  n_normal: 82
  min_duration_s: 49.9
  max_duration_s: 4000
  seed: 20261009

window:
  length_s: 2.0
  stride_s: 2.0
  frames: 8

question:
  prompt: c14

input_form:
  name: frames

backbone:
  name: gemma_generate
  asset: gemma-4-e4b
  prompt: structured
  decode: constrained
  max_new_tokens: 16
  memory_cap_gb: 40

answer_head:
  name: generated_answer

decision_rules:
  - name: threshold
    start: 0.0
    stop: 1.0
    step: 0.01
