# 14-class prompt: the question lists the 13 UCF-Crime anomaly classes + Normal; score = 1 - p(Normal).
# Gemma 4 E4B, structured prompt, constrained decoding (one of the 14 options; probabilities from their first-token logits).
# Latency and abnormal metrics on all UCF-Crime test videos with frame annotations: 140 anomaly + 150 normal = 290.
# Run: scripts/run.sh run configs/gemma4_e4b_constrained_ucf_test_c14_f8.yaml
name: gemma4_e4b_constrained_ucf_test_c14_f8

dataset:
  name: ucf_crime
  asset: ucf-crime
  n_anomaly: 140
  n_normal: 150
  max_duration_s: 4000
  seed: 20261009

window:
  length_s: 2.0
  stride_s: 2.0
  frames: 8

question:
  state: Surveillance camera footage, 2 seconds.
  text: What is happening?
  # UCF-Crime's 13 anomaly classes + Normal. Arrest is "Police arrest" (for Gemma 4 E4B "Arrest" and "Arson" share
  # their first token) and RoadAccidents is "Road accident"; the score is the sum over the 13 anomaly classes.
  options: [Normal, Abuse, Police arrest, Arson, Assault, Burglary, Explosion, Fighting, Road accident, Robbery,
            Shooting, Shoplifting, Stealing, Vandalism]
  positive: [Abuse, Police arrest, Arson, Assault, Burglary, Explosion, Fighting, Road accident, Robbery, Shooting,
             Shoplifting, Stealing, Vandalism]

input_form:
  name: frames

backbone:
  name: gemma_generate
  asset: gemma-4-e4b
  prompt: structured
  decode: constrained
  max_new_tokens: 16
  memory_cap_gb: 40

answer_head:
  name: generated_answer

decision_rules:
  - name: threshold
    start: 0.0
    stop: 1.0
    step: 0.01
