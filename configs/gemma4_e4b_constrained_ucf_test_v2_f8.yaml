# V2, ESOM style (arXiv 2026): the question is prompt v2 of src/s1stream/prompt.py; score 1 - p(None).
# Gemma 4 E4B, structured prompt, constrained decoding (one of the options; probabilities from their first-token logits).
# Latency and abnormal metrics on all UCF-Crime test videos with frame annotations: 140 anomaly + 150 normal = 290.
# max_duration_s 4000 keeps every test video (the longest is 60 min): 10.3 h, 18390 windows of 2 s.
# Run: scripts/run.sh run configs/gemma4_e4b_constrained_ucf_test_v2_f8.yaml
name: gemma4_e4b_constrained_ucf_test_v2_f8

dataset:
  name: ucf_crime
  asset: ucf-crime
  n_anomaly: 140
  n_normal: 150
  max_duration_s: 4000
  seed: 20261009

window:
  length_s: 2.0
  stride_s: 2.0
  frames: 8

question:
  prompt: v2

input_form:
  name: frames

backbone:
  name: gemma_generate
  asset: gemma-4-e4b
  prompt: structured
  decode: constrained
  max_new_tokens: 16
  memory_cap_gb: 40

answer_head:
  name: generated_answer

decision_rules:
  - name: threshold
    start: 0.0
    stop: 1.0
    step: 0.01
