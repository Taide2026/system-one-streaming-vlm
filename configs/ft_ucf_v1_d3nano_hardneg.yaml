# Stage 2 ablation (2026-10-24): hard labels + hard negatives: half of the negatives are label-0 windows of anomaly
# videos (outside the events), where the stage-1 models' false positives concentrate. Baseline: ft_ucf_v1_d3nano_hard.
name: ft_ucf_v1_d3nano_hardneg

data:
  asset: ucf-crime
  hivau_json: $S1_DATASETS/HolmesVAU/HIVAU-70k/raw_annotations/ucf_database_train.json  # S1_DATASETS: scripts/ft.sh
  n_abnormal: 10000
  n_normal: 10000
  n_val: 2000
  holdout: 0.1
  seed: 0
  hard_labels: true
  hard_negative_share: 0.5

window:
  length_s: 2.0
  stride_s: 2.0
  frames: 8

question:
  prompt: v1

backbone:
  name: d3
  asset: d3-nano

lora:
  r: 64
  alpha: 128
  dropout: 0.0

optim:
  lr: 1.5e-4
  head_lr: 1.5e-4
  warmup: 0.03
  batch: 8
  accumulate: 4
  epochs: 1
  workers: 6
  grad_checkpoint: true
