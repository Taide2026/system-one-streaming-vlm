# Latency and abnormal metrics of d3-flash (Decision 3.0) on the XD-Violence test set: 500 violent + 300 non-violent = 800.
# max_duration_s 4000 keeps every test video.
# Run: scripts/run.sh run configs/d3_flash_xd_test_f8.yaml
name: d3_flash_xd_test_f8

dataset:
  name: xd_violence
  asset: xd-violence
  n_violent: 500
  n_normal: 300
  max_duration_s: 4000
  seed: 20261009

window:
  length_s: 2.0
  stride_s: 2.0
  frames: 8

question:
  state: Surveillance camera footage, 2 seconds.
  text: Is something abnormal happening?
  options: ["Yes", "No"]
  positive: "Yes"

input_form:
  name: frames

backbone:
  name: d3
  asset: d3-flash
  memory_cap_gb: 40

answer_head:
  name: option_logits

decision_rules:
  - name: threshold
    start: 0.0
    stop: 1.0
    step: 0.01
