[project]
name = "s1stream"
version = "0.1.0"
description = "Streaming System One experiments: dataset, windowing, input form, backbone, answer head, decision rule, evaluation."
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.15.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "opencv-python-headless>=5.0.0.93",
    # imajev-4b ships a PEFT LoRA adapter (saved with peft 0.21.0).
    "peft>=0.21.0",
    "pillow>=12.3.0",
    "pyyaml>=6.0",
    "safetensors",
    "scikit-learn>=1.9.1",
    # The startlux backbone runs StartLux-Decision through its release package (transformers engine), at this commit.
    "startlux-decide @ git+https://github.com/StartLuxLabs/StartLux-Decision@83fe6c7d61a687a6e17f118b4f7d8f429f5d3a01",
    "torch>=2.14.1",
    "torchvision>=0.29.1",
    # Pinned to the version in the Jev-Omni requirements.txt (revision 5addda8).
    "transformers==5.17.0",
    # Constrained decoding of the gemma_generate backbone (decode: constrained).
    "xgrammar==0.2.8",
]

[project.scripts]
s1stream = "s1stream.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
# startlux-decide is pinned to a git commit (no release on PyPI).
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/s1stream"]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }

[tool.pytest.ini_options]
testpaths = ["tests"]
